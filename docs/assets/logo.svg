<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#grad)"/>
  <!-- Hub/neural network icon -->
  <g fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
    <!-- Center node -->
    <circle cx="60" cy="60" r="8" fill="white" stroke="none"/>
    <!-- Outer nodes -->
    <circle cx="36" cy="36" r="5" fill="white" stroke="none"/>
    <circle cx="84" cy="36" r="5" fill="white" stroke="none"/>
    <circle cx="36" cy="84" r="5" fill="white" stroke="none"/>
    <circle cx="84" cy="84" r="5" fill="white" stroke="none"/>
    <circle cx="60" cy="28" r="4" fill="white" stroke="none"/>
    <circle cx="60" cy="92" r="4" fill="white" stroke="none"/>
    <!-- Connections -->
    <line x1="60" y1="52" x2="40" y2="40"/>
    <line x1="60" y1="52" x2="80" y2="40"/>
    <line x1="60" y1="68" x2="40" y2="80"/>
    <line x1="60" y1="68" x2="80" y2="80"/>
    <line x1="60" y1="52" x2="60" y2="32"/>
    <line x1="60" y1="68" x2="60" y2="88"/>
    <!-- Cross connections (neural network feel) -->
    <line x1="40" y1="40" x2="60" y2="32" opacity="0.5"/>
    <line x1="80" y1="40" x2="60" y2="32" opacity="0.5"/>
    <line x1="40" y1="80" x2="60" y2="88" opacity="0.5"/>
    <line x1="80" y1="80" x2="60" y2="88" opacity="0.5"/>
  </g>
</svg>
