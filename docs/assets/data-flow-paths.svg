<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter, -apple-system, sans-serif">
  <rect width="1200" height="420" rx="12" fill="#1a1a2e"/>

  <!-- Write Path -->
  <text x="30" y="40" fill="#a0a0cc" font-size="13" font-weight="600">Write Path (Ingestion)</text>
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="78" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="39" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Capture</text>
    <text x="86" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="96" y="0" width="65" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="128" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">S3 PUT</text>
    <text x="169" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="179" y="0" width="62" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="210" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Queue</text>
    <text x="249" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="259" y="0" width="72" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="295" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Segment</text>
    <text x="339" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="349" y="0" width="62" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="380" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Embed</text>
    <text x="419" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="429" y="0" width="56" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="457" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Facts</text>
    <text x="493" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="503" y="0" width="60" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="533" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Dedup</text>
    <text x="571" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="581" y="0" width="60" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="611" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Graph</text>
    <text x="649" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="659" y="0" width="100" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="709" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Contradictions</text>
    <text x="767" y="19" fill="rgba(99,102,241,0.5)" font-size="11">→</text>
    <rect x="777" y="0" width="56" height="30" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="805" y="19" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">Index</text>
  </g>

  <!-- Read Path -->
  <text x="30" y="130" fill="#a0ccb0" font-size="13" font-weight="600">Read Path (Retrieval)</text>
  <g transform="translate(30, 142)">
    <rect x="0" y="0" width="60" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="30" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Query</text>
    <text x="68" y="19" fill="rgba(34,197,94,0.5)" font-size="11">→</text>
    <rect x="78" y="0" width="62" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="109" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Embed</text>
    <text x="148" y="19" fill="rgba(34,197,94,0.5)" font-size="11">→</text>
    <rect x="158" y="0" width="110" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="213" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">4-Signal Search</text>
    <text x="276" y="19" fill="rgba(34,197,94,0.5)" font-size="11">→</text>
    <rect x="286" y="0" width="90" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="331" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">RRF Fusion</text>
    <text x="384" y="19" fill="rgba(34,197,94,0.5)" font-size="11">→</text>
    <rect x="394" y="0" width="100" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="444" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Adaptive Rank</text>
    <text x="502" y="19" fill="rgba(34,197,94,0.5)" font-size="11">→</text>
    <rect x="512" y="0" width="66" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="545" y="19" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Results</text>
  </g>

  <!-- Cost Optimization -->
  <text x="30" y="220" fill="#c0a0e0" font-size="13" font-weight="600">Cost Optimization (every LLM call)</text>
  <g transform="translate(30, 232)">
    <rect x="0" y="0" width="110" height="30" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="55" y="19" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="500">Compress Context</text>
    <text x="118" y="19" fill="rgba(168,85,247,0.5)" font-size="11">→</text>
    <rect x="128" y="0" width="120" height="30" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="188" y="19" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="500">Verbosity Steering</text>
    <text x="256" y="19" fill="rgba(168,85,247,0.5)" font-size="11">→</text>
    <rect x="266" y="0" width="100" height="30" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="316" y="19" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="500">Effort Routing</text>
    <text x="374" y="19" fill="rgba(168,85,247,0.5)" font-size="11">→</text>
    <rect x="384" y="0" width="50" height="30" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="409" y="19" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="500">LLM</text>
    <text x="442" y="19" fill="rgba(168,85,247,0.5)" font-size="11">→</text>
    <rect x="452" y="0" width="95" height="30" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="500" y="19" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="500">Terse Output</text>
  </g>

  <!-- Intelligence -->
  <text x="30" y="310" fill="#e0b080" font-size="13" font-weight="600">Intelligence (Background)</text>
  <g transform="translate(30, 322)">
    <rect x="0" y="0" width="88" height="30" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="44" y="19" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="500">Compaction</text>
    <text x="96" y="19" fill="rgba(249,115,22,0.5)" font-size="11">→</text>
    <rect x="106" y="0" width="105" height="30" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="158" y="19" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="500">Contradictions</text>
    <text x="219" y="19" fill="rgba(249,115,22,0.5)" font-size="11">→</text>
    <rect x="229" y="0" width="120" height="30" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="289" y="19" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="500">Confidence Decay</text>
    <text x="357" y="19" fill="rgba(249,115,22,0.5)" font-size="11">→</text>
    <rect x="367" y="0" width="140" height="30" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="437" y="19" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="500">Feedback → Weights</text>
    <text x="515" y="19" fill="rgba(249,115,22,0.5)" font-size="11">→</text>
    <rect x="525" y="0" width="120" height="30" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <text x="585" y="19" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="500">Session Learning</text>
  </g>

  <!-- Footer -->
  <text x="30" y="400" fill="#666680" font-size="11">Every LLM call is cost-optimized (30-60% fewer tokens). Knowledge quality improves over time via contradiction detection, confidence calibration, and adaptive ranking.</text>
</svg>
