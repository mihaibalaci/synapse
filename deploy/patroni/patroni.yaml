# ══════════════════════════════════════════════════════════════════════════════
# Patroni Configuration — PostgreSQL HA for On-Premises Deployment
#
# Patroni manages a 3-node Postgres cluster with:
#   - Automatic leader election via DCS (etcd/Kubernetes)
#   - Synchronous replication (zero data loss)
#   - Automatic failover (<30s)
#   - pgvector + pg_trgm extensions pre-installed
#
# Deploy via Helm (internal Postgres mode) or standalone on VMs.
# ══════════════════════════════════════════════════════════════════════════════

scope: recall
name: ${PATRONI_NAME:-node1}

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${POD_IP:-127.0.0.1}:8008

# DCS (Distributed Configuration Store)
# Use Kubernetes endpoints when running in K8s, etcd for bare-metal
kubernetes:
  namespace: ${NAMESPACE:-default}
  labels:
    app.kubernetes.io/name: recall
    app.kubernetes.io/component: patroni
  use_endpoints: true

# For bare-metal: uncomment etcd, comment out kubernetes
# etcd3:
#   hosts:
#     - etcd1:2379
#     - etcd2:2379
#     - etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576  # 1MB
    synchronous_mode: true
    synchronous_mode_strict: false

    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        # Performance
        max_connections: 200
        shared_buffers: 4GB
        effective_cache_size: 12GB
        work_mem: 64MB
        maintenance_work_mem: 1GB
        random_page_cost: 1.1
        effective_io_concurrency: 200

        # WAL
        wal_buffers: 64MB
        min_wal_size: 1GB
        max_wal_size: 4GB
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10

        # pgvector performance
        shared_preload_libraries: 'vector,pg_stat_statements'
        # HNSW build parallelism
        max_parallel_maintenance_workers: 4
        max_parallel_workers_per_gather: 4
        max_parallel_workers: 8

        # Logging
        log_min_duration_statement: 1000
        log_checkpoints: 'on'
        log_connections: 'on'
        log_disconnections: 'on'

  initdb:
    - encoding: UTF8
    - data-checksums

  # Run after cluster initialization
  post_init: /scripts/post-init.sh

  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${POD_IP:-127.0.0.1}:5432
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass

  authentication:
    replication:
      username: replicator
      password: ${REPLICATOR_PASSWORD:-replicator}
    superuser:
      username: postgres
      password: ${POSTGRES_PASSWORD:-postgres}

  parameters:
    unix_socket_directories: '/var/run/postgresql'

  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
