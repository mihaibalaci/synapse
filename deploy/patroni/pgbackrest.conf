[global]
log-level-console=info
log-level-file=detail
process-max=4
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
repo1-retention-full=7
repo1-retention-diff=14

# Repository type/location and credentials must be injected with PGBACKREST_*
# environment variables (for example repo1-type=s3, bucket, endpoint, region).
[recall]
pg1-path=/var/lib/postgresql/data
