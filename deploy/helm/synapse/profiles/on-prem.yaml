global: { profile: on-prem }
# Patroni, Redis, MinIO, and model serving are separate lifecycle domains.
postgresql: { mode: managed, host: "synapse-patroni-primary.database.svc", port: 5432, database: synapse }
redis: { mode: managed, host: "synapse-redis-primary.cache.svc", port: 6379, tls: true }
objectStorage: { provider: minio, bucket: synapse-raw, region: us-east-1, endpoint: "https://synapse-minio.storage.svc:9000" }
embedding:
  provider: tei
  selfHosted: { url: "http://synapse-embedding.models.svc:8080", model: synapse-compatible-1536, dimensions: 1536 }
llm: { provider: local-none, model: "", selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.internal.example.com", audience: synapse }
runtimeSecret: { name: synapse-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: vault, secretStoreKind: ClusterSecretStore, remoteKey: synapse/prod/runtime, refreshInterval: 1h }
migration: { enabled: true, secretName: synapse-migrator, secretKey: DATABASE_URL, backoffLimit: 3 }
serviceMesh: { enabled: true, type: istio, mtls: { mode: STRICT } }
