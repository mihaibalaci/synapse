global:
  profile: cloud-aws
postgresql: { mode: managed, host: "aurora.cluster.example", port: 5432, database: synapse }
redis: { mode: managed, host: "redis.example", port: 6379, tls: true }
objectStorage: { provider: s3, bucket: synapse-raw-prod, region: us-east-1, endpoint: "" }
embedding:
  provider: openai
  openai: { model: text-embedding-3-small, dimensions: 768 }
llm: { provider: anthropic, model: claude-sonnet-4-20250514, selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.example.com", audience: synapse }
runtimeSecret: { name: synapse-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: aws-secrets-manager, secretStoreKind: ClusterSecretStore, remoteKey: synapse/prod/runtime, refreshInterval: 1h }
migration: { enabled: true, backoffLimit: 3 }
api:
  ingress:
    className: alb
    annotations: { alb.ingress.kubernetes.io/scheme: internal, alb.ingress.kubernetes.io/target-type: ip }
serviceMesh: { enabled: false, type: istio, mtls: { mode: STRICT } }
