global:
  profile: cloud-gcp
postgresql: { mode: managed, host: "cloudsql.private.example", port: 5432, database: synapse }
redis: { mode: managed, host: "memorystore.private.example", port: 6379, tls: true }
# Recall uses the S3 API; GCS deployments require HMAC interoperability keys
# in the runtime secret until a native GCS object-storage adapter is added.
objectStorage: { provider: gcs-s3-interop, bucket: synapse-raw-prod, region: us-central1, endpoint: "https://storage.googleapis.com" }
embedding:
  provider: openai
  openai: { model: text-embedding-3-small, dimensions: 1536 }
llm: { provider: claude, model: claude-sonnet-4-20250514, selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.example.com", audience: synapse }
runtimeSecret: { name: synapse-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: gcp-secret-manager, secretStoreKind: ClusterSecretStore, remoteKey: synapse-prod-runtime, refreshInterval: 1h }
migration: { enabled: true, secretName: synapse-migrator, secretKey: DATABASE_URL, backoffLimit: 3 }
api:
  ingress:
    className: gce
    annotations: { kubernetes.io/ingress.class: gce-internal }
serviceMesh: { enabled: false, type: istio, mtls: { mode: STRICT } }
