global: { profile: hybrid }
# Stateful dependencies are deployed independently and exposed privately.
postgresql: { mode: managed, host: "patroni-primary.database.svc", port: 5432, database: synapse }
redis: { mode: managed, host: "redis-primary.cache.svc", port: 6379, tls: true }
objectStorage: { provider: s3, bucket: synapse-raw-prod, region: us-east-1, endpoint: "" }
embedding:
  provider: tei
  selfHosted: { url: "http://synapse-embedding:11434", model: nomic-embed-text, dimensions: 768 }
llm: { provider: anthropic, model: claude-sonnet-4-20250514, selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.internal.example.com", audience: synapse }
runtimeSecret: { name: synapse-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: vault, secretStoreKind: ClusterSecretStore, remoteKey: synapse/prod/runtime, refreshInterval: 1h }
migration: { enabled: true, backoffLimit: 3 }
serviceMesh: { enabled: true, type: istio, mtls: { mode: STRICT } }
