{{- if eq .Values.secrets.provider "env" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.runtimeSecretName" . }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "runtimeSecret.values.databaseUrl is required" .Values.runtimeSecret.values.databaseUrl | quote }}
  REDIS_URL: {{ required "runtimeSecret.values.redisUrl is required" .Values.runtimeSecret.values.redisUrl | quote }}
  {{- if .Values.runtimeSecret.values.authJwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.runtimeSecret.values.authJwtSecret | quote }}
  {{- end }}
  {{- if .Values.runtimeSecret.values.authJwtPublicKey }}
  AUTH_JWT_PUBLIC_KEY: {{ .Values.runtimeSecret.values.authJwtPublicKey | quote }}
  {{- end }}
  {{- if .Values.runtimeSecret.values.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.runtimeSecret.values.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.runtimeSecret.values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.runtimeSecret.values.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.runtimeSecret.values.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.runtimeSecret.values.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.runtimeSecret.values.awsSecretAccessKey | quote }}
  {{- end }}
{{- else if eq .Values.secrets.provider "external-secrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-runtime
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind }}
    name: {{ .Values.secrets.externalSecrets.secretStore }}
  target:
    name: {{ include "synapse.runtimeSecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.externalSecrets.remoteKey }}
{{- else if ne .Values.secrets.provider "existing" }}
{{ fail "secrets.provider must be env, existing, or external-secrets" }}
{{- end }}
