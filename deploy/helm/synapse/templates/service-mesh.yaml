{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.type "istio") }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata: { name: {{ .Release.Name }}-mtls }
spec:
  mtls: { mode: {{ .Values.serviceMesh.mtls.mode }} }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: {{ .Release.Name }}-api }
spec:
  host: {{ .Release.Name }}-api
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 100 }
      http: { http1MaxPendingRequests: 100, http2MaxRequests: 1000 }
    outlierDetection: { consecutive5xxErrors: 3, interval: 30s, baseEjectionTime: 60s }
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata: { name: {{ .Release.Name }}-worker-deny-ingress }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: synapse, app.kubernetes.io/component: worker }
  rules: []
{{- end }}
