global:
  profile: on-prem
  imageRegistry: ""
  imagePullSecrets: []
  domain: synapse.internal.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

api:
  replicaCount: 3
  image:
    repository: synapse/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 3000
  env:
    NODE_ENV: production
    LOG_LEVEL: info
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPU: 70
    targetMemory: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: synapse-tls

worker:
  replicaCount: 5
  image:
    repository: synapse/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  env:
    WORKER_CONCURRENCY: "10"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPU: 80
    targetQueueDepth: "1000"
    queueMetric:
      enabled: false
      name: synapse_queue_depth
      selector: {}

# Stateful services are deliberately external to this application chart.
# Use managed services or deploy Patroni/Redis/MinIO independently.
postgresql:
  mode: managed
  host: patroni-primary
  port: 5432
  database: synapse
redis:
  mode: managed
  host: redis-primary
  port: 6379
  tls: false

objectStorage:
  provider: minio
  bucket: synapse-raw
  region: us-east-1
  endpoint: http://minio:9000

embedding:
  provider: tei
  openai:
    model: text-embedding-3-small
    dimensions: 768
  selfHosted:
    url: http://embedding-server:11434
    model: nomic-embed-text
    dimensions: 768

llm:
  provider: local-none
  model: ""
  selfHosted:
    url: ""
    model: ""

auth:
  issuer: https://auth.example.com
  audience: synapse

# Runtime secret keys: DATABASE_URL, REDIS_URL, and AUTH_JWT_SECRET.
# Provider API keys and static S3 credentials are optional when workload
# identity is used.
runtimeSecret:
  name: ""
  values:
    databaseUrl: ""
    redisUrl: ""
    authJwtSecret: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""

secrets:
  provider: external-secrets
  externalSecrets:
    secretStore: cluster-secret-store
    secretStoreKind: ClusterSecretStore
    remoteKey: synapse/runtime
    refreshInterval: 1h

migration:
  enabled: true
  backoffLimit: 3

embeddingBackfill:
  enabled: false
  batchSize: 50
  targetVersion: 1

compaction:
  # The worker already runs compaction on an interval (COMPACTION_INTERVAL_HOURS,
  # 6h by default), so this CronJob is only needed when workers are scaled to
  # zero or compaction should run on a fixed window instead.
  enabled: false
  # Weekly at 02:00 UTC on Sunday
  schedule: "0 2 * * 0"
  # "all" compacts every organization. Set a single organization id to scope a
  # run; a comma-separated list is not supported.
  organizations: "all"
  # Level 1 and 2: a conversation or standalone session is eligible once its most
  # recent capture is this old.
  minAgeDays: 14
  # Conversations plus standalone sessions summarized per run.
  maxPerRun: 100
  # Level 3: merge summaries of separate conversations that share a topic.
  topic:
    enabled: true
    # Keep per-conversation summaries retrievable on their own for this long
    # before folding them into a topic summary. 0 means 2x minAgeDays.
    minAgeDays: 28
    # Minimum cosine similarity between summaries to count as the same topic.
    similarity: 0.82
    # Distinct conversations a group must span before merging is worthwhile.
    minConversations: 2
  # Topic merges per run.
  maxClusters: 50
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }

availability:
  podDisruptionBudget:
    enabled: true
    apiMinAvailable: 2
    workerMinAvailable: 2

networkPolicy:
  enabled: true

observability:
  otel:
    enabled: false
    endpoint: http://otel-collector:4317

serviceMesh:
  enabled: false
  type: istio
  mtls:
    mode: STRICT
