global: { profile: hybrid }
# Stateful dependencies are deployed independently and exposed privately.
postgresql: { mode: managed, host: "patroni-primary.database.svc", port: 5432, database: recall }
redis: { mode: managed, host: "redis-primary.cache.svc", port: 6379, tls: true }
objectStorage: { provider: s3, bucket: recall-raw-prod, region: us-east-1, endpoint: "" }
embedding:
  provider: tei
  selfHosted: { url: "http://recall-embedding:8080", model: recall-compatible-1536, dimensions: 1536 }
llm: { provider: claude, model: claude-sonnet-4-20250514, selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.internal.example.com", audience: recall }
runtimeSecret: { name: recall-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: vault, secretStoreKind: ClusterSecretStore, remoteKey: recall/prod/runtime, refreshInterval: 1h }
migration: { enabled: true, secretName: recall-migrator, secretKey: DATABASE_URL, backoffLimit: 3 }
serviceMesh: { enabled: true, type: istio, mtls: { mode: STRICT } }
