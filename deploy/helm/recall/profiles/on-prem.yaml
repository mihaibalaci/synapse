global: { profile: on-prem }
# Patroni, Redis, MinIO, and model serving are separate lifecycle domains.
postgresql: { mode: managed, host: "recall-patroni-primary.database.svc", port: 5432, database: recall }
redis: { mode: managed, host: "recall-redis-primary.cache.svc", port: 6379, tls: true }
objectStorage: { provider: minio, bucket: recall-raw, region: us-east-1, endpoint: "https://recall-minio.storage.svc:9000" }
embedding:
  provider: tei
  selfHosted: { url: "http://recall-embedding.models.svc:8080", model: recall-compatible-1536, dimensions: 1536 }
llm: { provider: local-none, model: "", selfHosted: { url: "", model: "" } }
auth: { issuer: "https://auth.internal.example.com", audience: recall }
runtimeSecret: { name: recall-runtime }
secrets:
  provider: external-secrets
  externalSecrets: { secretStore: vault, secretStoreKind: ClusterSecretStore, remoteKey: recall/prod/runtime, refreshInterval: 1h }
migration: { enabled: true, secretName: recall-migrator, secretKey: DATABASE_URL, backoffLimit: 3 }
serviceMesh: { enabled: true, type: istio, mtls: { mode: STRICT } }
