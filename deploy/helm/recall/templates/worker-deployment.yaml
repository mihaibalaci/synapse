apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: recall
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: recall
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recall
        app.kubernetes.io/component: worker
        {{- if .Values.serviceMesh.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: QUEUE_CONCURRENCY
              value: "{{ .Values.worker.env.QUEUE_CONCURRENCY }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis-credentials
                  key: url
            - name: S3_BUCKET
              value: "{{ .Values.objectStorage.bucket }}"
            - name: S3_ENDPOINT
              value: "{{ .Values.objectStorage.endpoint }}"
            - name: S3_REGION
              value: "{{ .Values.objectStorage.region }}"
            - name: EMBEDDING_PROVIDER
              value: "{{ .Values.embedding.provider }}"
            - name: EMBEDDING_MODEL
              value: "{{ if eq .Values.embedding.provider "openai" }}{{ .Values.embedding.openai.model }}{{ else }}{{ .Values.embedding.selfHosted.model }}{{ end }}"
            - name: EMBEDDING_DIMENSIONS
              value: "{{ if eq .Values.embedding.provider "openai" }}{{ .Values.embedding.openai.dimensions }}{{ else }}{{ .Values.embedding.selfHosted.dimensions }}{{ end }}"
            {{- if ne .Values.embedding.provider "openai" }}
            - name: EMBEDDING_URL
              value: "{{ .Values.embedding.selfHosted.url }}"
            {{- end }}
            - name: LLM_PROVIDER
              value: "{{ .Values.llm.provider }}"
            {{- if .Values.llm.selfHosted.url }}
            - name: LLM_URL
              value: "{{ .Values.llm.selfHosted.url }}"
            {{- end }}
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"
            {{- end }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            periodSeconds: 30
