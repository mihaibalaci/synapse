{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-api-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: recall, app.kubernetes.io/component: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-worker-ingress }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: recall, app.kubernetes.io/component: worker }
  policyTypes: [Ingress]
  ingress: []
{{- end }}
