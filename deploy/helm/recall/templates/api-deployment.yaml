apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: recall
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: recall
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recall
        app.kubernetes.io/component: api
        {{- if .Values.serviceMesh.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: NODE_ENV
              value: "{{ .Values.api.env.NODE_ENV }}"
            - name: LOG_LEVEL
              value: "{{ .Values.api.env.LOG_LEVEL }}"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: url
            # Redis
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis-credentials
                  key: url
            # Object Storage
            - name: S3_BUCKET
              value: "{{ .Values.objectStorage.bucket }}"
            - name: S3_ENDPOINT
              value: "{{ .Values.objectStorage.endpoint }}"
            - name: S3_REGION
              value: "{{ .Values.objectStorage.region }}"
            # Embedding
            - name: EMBEDDING_PROVIDER
              value: "{{ .Values.embedding.provider }}"
            - name: EMBEDDING_MODEL
              value: "{{ if eq .Values.embedding.provider "openai" }}{{ .Values.embedding.openai.model }}{{ else }}{{ .Values.embedding.selfHosted.model }}{{ end }}"
            - name: EMBEDDING_DIMENSIONS
              value: "{{ if eq .Values.embedding.provider "openai" }}{{ .Values.embedding.openai.dimensions }}{{ else }}{{ .Values.embedding.selfHosted.dimensions }}{{ end }}"
            {{- if ne .Values.embedding.provider "openai" }}
            - name: EMBEDDING_URL
              value: "{{ .Values.embedding.selfHosted.url }}"
            {{- end }}
            # LLM
            - name: LLM_PROVIDER
              value: "{{ .Values.llm.provider }}"
            {{- if .Values.llm.selfHosted.url }}
            - name: LLM_URL
              value: "{{ .Values.llm.selfHosted.url }}"
            {{- end }}
            # OTEL
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"
            {{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: recall
    app.kubernetes.io/component: api
