global:
  profile: on-prem
  imageRegistry: ""
  imagePullSecrets: []
  domain: recall.internal.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

api:
  replicaCount: 3
  image:
    repository: recall/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 3000
  env:
    NODE_ENV: production
    LOG_LEVEL: info
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPU: 70
    targetMemory: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    tls:
      enabled: true
      secretName: recall-tls

worker:
  replicaCount: 5
  image:
    repository: recall/worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  env:
    QUEUE_CONCURRENCY: "10"
  healthPort: 3001
  # Liveness fails if the dispatch loop has not completed within this window.
  heartbeatStaleMs: 60000
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPU: 80
    targetQueueDepth: "1000"
    queueMetric:
      enabled: false
      name: bullmq_queue_depth
      selector: {}

# Stateful services are deliberately external to this application chart.
# Use managed services or deploy Patroni/Redis/MinIO independently.
postgresql:
  mode: managed
  host: patroni-primary
  port: 5432
  database: recall
redis:
  mode: managed
  host: redis-primary
  port: 6379
  tls: false

objectStorage:
  provider: minio
  bucket: recall-raw
  region: us-east-1
  endpoint: http://minio:9000

embedding:
  provider: tei
  openai:
    model: text-embedding-3-small
    dimensions: 1536
  selfHosted:
    url: http://embedding-server:8080
    model: recall-compatible-1536
    dimensions: 1536

llm:
  provider: local-none
  model: ""
  selfHosted:
    url: ""
    model: ""

auth:
  issuer: https://auth.example.com
  audience: recall

# Runtime secret keys: DATABASE_URL, REDIS_URL, and one of
# AUTH_JWT_SECRET/AUTH_JWT_PUBLIC_KEY. Provider API keys and static S3
# credentials are optional when workload identity is used.
runtimeSecret:
  name: ""
  values:
    databaseUrl: ""
    redisUrl: ""
    authJwtSecret: ""
    authJwtPublicKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""

secrets:
  provider: external-secrets
  externalSecrets:
    secretStore: cluster-secret-store
    secretStoreKind: ClusterSecretStore
    remoteKey: recall/runtime
    refreshInterval: 1h

migration:
  enabled: true
  secretName: recall-migrator
  secretKey: DATABASE_URL
  backoffLimit: 3

embeddingBackfill:
  enabled: false
  batchSize: 50
  targetVersion: 1

availability:
  podDisruptionBudget:
    enabled: true
    apiMinAvailable: 2
    workerMinAvailable: 2

networkPolicy:
  enabled: true

observability:
  otel:
    enabled: false
    endpoint: http://otel-collector:4317

serviceMesh:
  enabled: false
  type: istio
  mtls:
    mode: STRICT
